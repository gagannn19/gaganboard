<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>गगनBoard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">

  <style>
    *{
      font-family:'Poppins',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#fef3c7,#dbeafe,#fce7f3);
      min-height:100vh;
      overflow-x:hidden;
    }

    .logo{
      font-family:'Noto Sans Devanagari',sans-serif;
    }

    .glass{
      background:rgba(255,255,255,0.7);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.5);
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .slide-image{
      max-height:70vh;
      object-fit:contain;
      transition:0.3s ease;
    }

    .slide-image:hover{
      transform:scale(1.01);
    }

    textarea{
      resize:none;
    }
  </style>
</head>

<body>

<div class="min-h-screen p-5 lg:p-8">

  <!-- HEADER -->
  <div id="topBar" class="flex flex-col lg:flex-row justify-between gap-5 mb-6">

    <div>
      <h1 class="text-5xl font-bold text-slate-800 logo">
        गगन<span class="text-blue-600">Board</span>
      </h1>

      <p class="text-slate-600 mt-3 text-lg">
        Visual teaching platform for classrooms.
      </p>
    </div>

    <div class="flex gap-3 flex-wrap">

      <button id="fullscreenBtn"
        class="bg-gradient-to-r from-pink-500 to-orange-500 text-white px-5 py-3 rounded-2xl hover:scale-105 transition shadow-lg font-medium">
        🎥 Presentation Mode
      </button>

    </div>
  </div>

  <!-- MAIN -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- SIDEBAR -->
    <div id="sidebar" class="glass rounded-3xl p-5 lg:col-span-1">

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-slate-800">Slides</h2>

        <span id="slideNumberBadge"
          class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold">
          10
        </span>
      </div>

      <div id="slidesList" class="space-y-3"></div>

    </div>

    <!-- CONTENT -->
    <div class="glass rounded-3xl p-6 lg:col-span-3">

      <div id="presentationArea">

        <div id="normalControls"
          class="flex flex-wrap justify-between gap-4 mb-5 items-start">

          <div>
            <h2 id="slideTitle"
              class="text-3xl font-bold text-slate-800"></h2>

            <p id="slideCount"
              class="text-slate-500 mt-1"></p>
          </div>

          <div class="flex gap-2">

            <button id="prevBtn"
              class="bg-slate-200 hover:bg-slate-300 px-5 py-2 rounded-xl font-semibold transition">
              ◀ Prev
            </button>

            <button id="nextBtn"
              class="bg-slate-200 hover:bg-slate-300 px-5 py-2 rounded-xl font-semibold transition">
              Next ▶
            </button>

          </div>
        </div>

        <div class="flex justify-center mb-6">
          <img id="slideImage"
            class="slide-image rounded-3xl shadow-2xl"
            src="">
        </div>

        <div id="notesSection">

          <label class="text-xl font-bold text-slate-800 block mb-3">
            Explanation Notes
          </label>

          <textarea
            id="slideNotes"
            class="w-full min-h-[160px] bg-white/80 border border-slate-200 rounded-3xl p-5 text-slate-700 focus:outline-none focus:ring-4 focus:ring-blue-200"
          ></textarea>

        </div>

      </div>
    </div>
  </div>
</div>

<script>

let slides = [

  {
    title: "Step 1",
    image: "photos/1.png",
    notes: "Visit the Krita website."
  },

  {
    title: "Step 2",
    image: "photos/2.png",
    notes: "Click the download button."
  },

  {
    title: "Step 3",
    image: "photos/3.png",
    notes: "Download installer."
  },

  {
    title: "YouTube Channel",
    image: "photos/4.png",
    notes: "My YouTube channel."
  },

  {
    title: "Books",
    image: "photos/5.jpg",
    notes: "Books and study material."
  },

  {
    title: "Cricket Bat",
    image: "photos/6.jpg",
    notes: "DSC cricket bat."
  },

  {
    title: "Cricket Kit",
    image: "photos/7.jpg",
    notes: "Cricket setup."
  },

  {
    title: "Portrait",
    image: "photos/8.png",
    notes: "Portrait image."
  },

  {
    title: "Car Thumbnail",
    image: "photos/9.jpeg",
    notes: "Drag race thumbnail."
  },

  {
    title: "Expression Photo",
    image: "photos/10.jpeg",
    notes: "Portrait image."
  }

];

const slidesList = document.getElementById('slidesList');
const slideImage = document.getElementById('slideImage');
const slideTitle = document.getElementById('slideTitle');
const slideCount = document.getElementById('slideCount');
const slideNotes = document.getElementById('slideNotes');

let currentSlide = 0;

function renderSlides(){

  slidesList.innerHTML='';

  slides.forEach((slide,index)=>{

    const button=document.createElement('button');

    button.className=`
      w-full p-3 rounded-2xl text-left transition-all duration-200
      ${index===currentSlide
      ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg scale-[1.02]'
      : 'bg-white hover:bg-slate-100 text-slate-700'}
    `;

    button.innerHTML=`
      <div class="font-semibold truncate">${slide.title}</div>
      <div class="text-sm opacity-80 mt-1">
        Slide ${index+1}
      </div>
    `;

    button.onclick=()=>showSlide(index);

    slidesList.appendChild(button);

  });

}

function showSlide(index){

  currentSlide=index;

  const slide=slides[index];

  slideImage.src=slide.image;
  slideTitle.textContent=slide.title;
  slideCount.textContent=`Slide ${index+1} of ${slides.length}`;
  slideNotes.value=slide.notes;

  renderSlides();

}

document.getElementById('nextBtn').onclick=()=>{

  if(currentSlide<slides.length-1){
    showSlide(currentSlide+1);
  }

};

document.getElementById('prevBtn').onclick=()=>{

  if(currentSlide>0){
    showSlide(currentSlide-1);
  }

};

document.addEventListener('keydown',(e)=>{

  if(e.key==='ArrowRight' && currentSlide<slides.length-1){
    showSlide(currentSlide+1);
  }

  if(e.key==='ArrowLeft' && currentSlide>0){
    showSlide(currentSlide-1);
  }

});

document.getElementById('fullscreenBtn').onclick=async()=>{

  if(!document.fullscreenElement){

    await document.documentElement.requestFullscreen();

    document.getElementById('sidebar').style.display='none';
    document.getElementById('topBar').style.display='none';
    document.getElementById('normalControls').style.display='none';

    slideImage.style.maxHeight='80vh';

    slideNotes.style.fontSize='24px';

  }else{

    document.exitFullscreen();

  }

};

document.addEventListener('fullscreenchange',()=>{

  if(!document.fullscreenElement){

    document.getElementById('sidebar').style.display='block';
    document.getElementById('topBar').style.display='flex';
    document.getElementById('normalControls').style.display='flex';

    slideImage.style.maxHeight='70vh';

    slideNotes.style.fontSize='16px';

  }

});

showSlide(0);

</script>

</body>
</html>
